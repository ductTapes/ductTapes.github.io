<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ductTapes — apps</title>
<meta name="description" content="ductTapes builds and publishes mobile and web apps.">
<style>
  :root{--bg:#0d0820;--card:#160f30;--fg:#eae6f5;--muted:#a99fc7;--acc:#c96fe0;--acc2:#4baee8;--line:#2a2150}
  @media (prefers-color-scheme:light){:root{--bg:#f6f4fb;--card:#fff;--fg:#1c1240;--muted:#5c5478;--acc:#8a3fb0;--acc2:#2b7fc0;--line:#e6e1f2}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg)}
  .wrap{max-width:620px;padding:48px 24px;width:100%}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.4rem;flex:0 0 auto}
  h1{font-size:1.8rem;margin:.1em 0}
  .tag{color:var(--muted);margin:.2em 0 2em}
  .apps{display:flex;flex-direction:column;gap:12px}
  .app{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .app h2{margin:0 0 2px;font-size:1.15rem}
  .app p{margin:0 0 10px;color:var(--muted);font-size:.92rem}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{font-size:.86rem;text-decoration:none;color:var(--acc);border:1px solid var(--line);
    border-radius:8px;padding:5px 11px}
  .links a:hover{border-color:var(--acc)}
  footer{color:var(--muted);font-size:.82rem;margin-top:2.4em}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark">d</div>
    <h1>ductTapes</h1>
  </div>
  <p class="tag">We build and publish mobile &amp; web apps.</p>

  <div class="apps">
    <div class="app">
      <h2>TwoFrame</h2>
      <p>Record portrait and landscape video simultaneously — one tap, two formats.</p>
      <div class="links">
        <a href="twoframe/">Support</a>
        <a href="twoframe/privacy.html">Privacy</a>
        <a href="twoframe/terms.html">Terms</a>
      </div>
    </div>
  </div>

  <footer>© 2025 ductTapes · <a href="mailto:grishchenko-yuriy1996@yandex.com" style="color:var(--muted)">grishchenko-yuriy1996@yandex.com</a></footer>
</div>
</body>
</html>
