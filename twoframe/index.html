<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwoFrame</title>
<meta name="description" content="TwoFrame — record portrait and landscape video simultaneously.">
<style>
  :root{--bg:#0d0820;--card:#160f30;--fg:#eae6f5;--muted:#a99fc7;--acc:#c96fe0;--line:#2a2150}
  @media (prefers-color-scheme:light){:root{--bg:#f6f4fb;--card:#fff;--fg:#1c1240;--muted:#5c5478;--acc:#8a3fb0;--line:#e6e1f2}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg)}
  .wrap{max-width:560px;padding:48px 24px;width:100%}
  header{display:flex;align-items:center;gap:14px}
  .logo{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#1c1240,#0d0820);position:relative;flex:0 0 auto;border:1px solid var(--line)}
  .logo::before,.logo::after{content:"";position:absolute;inset:0;margin:auto;border-radius:4px}
  .logo::before{width:30px;height:13px;background:#82d0f8;opacity:.78}
  .logo::after{width:13px;height:30px;background:#e89aee;opacity:.78}
  h1{font-size:1.9rem;margin:.1em 0}
  .tag{color:var(--muted);margin:.3em 0 2em}
  .links{display:flex;flex-wrap:wrap;gap:10px}
  .links a{text-decoration:none;color:var(--acc);border:1px solid var(--line);border-radius:9px;padding:9px 16px}
  .links a:hover{border-color:var(--acc)}
  footer{color:var(--muted);font-size:.83rem;margin-top:2.4em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"></div>
    <h1>TwoFrame</h1>
  </header>
  <p class="tag">Record portrait and landscape video simultaneously — one tap, two formats, ready for any platform.</p>
  <div class="links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </div>
  <footer>© 2025 Yuriy Grishchenko · <a href="mailto:grishchenko-yuriy1996@yandex.com" style="color:var(--muted)">grishchenko-yuriy1996@yandex.com</a></footer>
</div>
</body>
</html>
